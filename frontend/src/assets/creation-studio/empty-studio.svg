<!--
  创作页 · 首次空态插画（还没有任何创作记录）
  用法：<img class="cs-illu" src="...empty-studio.svg" alt="" aria-hidden="true" />
  说明：用中性灰 + 少量青色/琥珀点缀，灰阶取在 400~500 之间，
        在浅色卡片（gray-50/white）和深色卡片（dark-800）上都能成立，因此不需要双套资源。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="112" viewBox="0 0 160 112" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="cs-wand" x1="96" y1="8" x2="118" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="80" cy="103" rx="56" ry="5" fill="#94a3b8" fill-opacity=".16" />

  <!-- 后排：视频卡片 -->
  <g transform="rotate(4 116 58)">
    <rect x="84" y="30" width="60" height="56" rx="9" fill="#94a3b8" fill-opacity=".20" />
    <rect x="84.75" y="30.75" width="58.5" height="54.5" rx="8.25" stroke="#64748b" stroke-opacity=".25" stroke-width="1.5" />
    <circle cx="114" cy="58" r="13" fill="#14b8a6" fill-opacity=".18" />
    <path d="M110.5 51.6a1.4 1.4 0 0 1 2.1-1.2l7.4 4.7a1.4 1.4 0 0 1 0 2.4l-7.4 4.7a1.4 1.4 0 0 1-2.1-1.2v-9.4Z" fill="#0d9488" fill-opacity=".85" />
    <rect x="92" y="72" width="26" height="4" rx="2" fill="#64748b" fill-opacity=".35" />
  </g>

  <!-- 前排：图片卡片 -->
  <g transform="rotate(-4 56 58)">
    <rect x="20" y="26" width="68" height="62" rx="10" fill="#94a3b8" fill-opacity=".16" />
    <rect x="20.75" y="26.75" width="66.5" height="60.5" rx="9.25" stroke="#64748b" stroke-opacity=".3" stroke-width="1.5" />
    <path d="M25 76.5 44 56l11 11.5 8.5-8 15 17z" fill="#64748b" fill-opacity=".45" />
    <circle cx="68" cy="42" r="5" fill="#f59e0b" fill-opacity=".55" />
    <rect x="30" y="80" width="22" height="4" rx="2" fill="#64748b" fill-opacity=".35" />
  </g>

  <!-- 魔法棒 -->
  <g transform="rotate(38 82 60)">
    <rect x="77" y="26" width="6" height="30" rx="3" fill="url(#cs-wand)" />
    <rect x="77" y="24" width="6" height="7" rx="3" fill="#99f6e4" />
  </g>

  <!-- 闪光 -->
  <path d="M92 14c.7 3.2 2.1 4.6 5.3 5.3-3.2.7-4.6 2.1-5.3 5.3-.7-3.2-2.1-4.6-5.3-5.3 3.2-.7 4.6-2.1 5.3-5.3Z" fill="#14b8a6" fill-opacity=".8" />
  <path d="M130 18c.5 2.2 1.4 3.1 3.6 3.6-2.2.5-3.1 1.4-3.6 3.6-.5-2.2-1.4-3.1-3.6-3.6 2.2-.5 3.1-1.4 3.6-3.6Z" fill="#f59e0b" fill-opacity=".7" />
  <circle cx="24" cy="20" r="2" fill="#64748b" fill-opacity=".4" />
  <circle cx="140" cy="74" r="2.5" fill="#14b8a6" fill-opacity=".35" />
</svg>
